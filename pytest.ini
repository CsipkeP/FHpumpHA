[pytest]
testpaths = tests
# The repository root has to be importable before -p loads tests.win_compat,
# and "pytest" (the console script) does not put the working directory on
# sys.path the way "python -m pytest" does.  This ini option is applied early
# enough for both.
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -q -p tests.win_compat
filterwarnings =
    error::DeprecationWarning:fujitsu_waterstage.*
    error::DeprecationWarning:custom_components.*
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
