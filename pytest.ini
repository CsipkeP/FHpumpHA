[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -q -p tests.win_compat
filterwarnings =
    error::DeprecationWarning:fujitsu_waterstage.*
    error::DeprecationWarning:custom_components.*
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
